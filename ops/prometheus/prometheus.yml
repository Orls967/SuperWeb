global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: 'superweb-platform'
    metrics_path: '/ops/metrics'
    scrape_interval: 10s
    static_configs:
      - targets: ['app:8000']
        labels:
          environment: 'production'
          app: 'superweb'
          cluster: 'autoserve-primary'
          service: 'core-enterprise'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
